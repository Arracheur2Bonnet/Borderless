name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }}, py3.11)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Audit the locked dependencies for known vulnerabilities
        if: runner.os == 'Linux'
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements-lock.txt -r requirements-dev.txt

      - name: Verify (pytest, 21 missions, golden path, security report, evidence reproducibility)
        run: python scripts/verify_all.py --report-dir verify-report

      - name: Upload evidence and test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: verification-${{ matrix.os }}
          path: |
            verify-report/
            deliverables/evidence/
            deliverables/task_completion.md
          if-no-files-found: warn

  docker:
    name: docker image (build + health check)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Build
        run: docker build -t borderlessguard .

      - name: Run the demo and wait for Streamlit to be healthy
        run: |
          docker run -d --name bg -p 127.0.0.1:8501:8501 borderlessguard
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8501/_stcore/health; then echo; echo "healthy after ${i}s"; exit 0; fi
            sleep 1
          done
          docker logs bg
          exit 1

      - name: Run the verification inside the image
        run: docker run --rm borderlessguard python scripts/verify_all.py
