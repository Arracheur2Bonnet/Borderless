# Native Streamlit widgets (data grids, inputs) take these colours; design/tokens.css drives everything else.
# Light only: BorderlessGuard has no dark theme (design/BRAND.md).
[theme]
base = "light"
primaryColor = "#2741d4"
backgroundColor = "#f6f5f1"
secondaryBackgroundColor = "#ffffff"
textColor = "#16171a"
font = "sans-serif"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = "none"          # no tracebacks in the browser (APPSEC-3)

# Local demo by default (APPSEC-3): listen on this machine only, accept only local Host headers (DNS rebinding),
# small uploads (invoices are text, cut to 20,000 characters anyway) and no tracebacks in the browser.
# The Docker image overrides the address with --server.address=0.0.0.0 inside the container; publish it with
# `-p 127.0.0.1:8501:8501`. To serve other machines on purpose, override address and allowedHosts explicitly.
[server]
address = "127.0.0.1"
allowedHosts = ["localhost", "127.0.0.1"]
maxUploadSize = 1
enableXsrfProtection = true

