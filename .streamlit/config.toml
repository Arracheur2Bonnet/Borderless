# Native Streamlit widgets (data grids, inputs) take these colours; design/tokens.css drives everything else.
[theme.light]
primaryColor = "#0071e3"
backgroundColor = "#f5f5f7"
secondaryBackgroundColor = "#ffffff"
textColor = "#1d1d1f"
font = "sans-serif"

[theme.dark]
primaryColor = "#0a74e6"
backgroundColor = "#000000"
secondaryBackgroundColor = "#1c1c1e"
textColor = "#f5f5f7"
font = "sans-serif"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
